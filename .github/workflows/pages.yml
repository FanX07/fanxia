name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout portfolio source
        uses: actions/checkout@v4
        with:
          repository: FanX07/FanX07.github.io
          ref: 9dd547002747b6e3bf0111bde9a8809f9c2f246b
          sparse-checkout: fanxia
          path: source
      - name: Prepare independent website
        run: |
          mkdir site
          cp -a source/fanxia/. site/
          printf 'ffanxia.com\n' > site/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for uploaded Pages artifact
        uses: actions/github-script@v7
        with:
          script: |
            const name = 'github-pages-' + context.runId + '-' + process.env.GITHUB_RUN_ATTEMPT;
            for (let attempt = 0; attempt < 18; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({ owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId });
              if (data.artifacts.some(artifact => artifact.name === name && !artifact.expired)) {
                core.info('Pages artifact is available: ' + name);
                return;
              }
              core.info('Waiting for artifact metadata to become available');
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('Uploaded Pages artifact is not yet visible; retry this deployment.');
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 600000

# Fresh deployment after the previous Pages sync timed out.
